cv:
  name: Yuta Kawada
  headline: Cloud Support Engineer I (Deployment), Amazon Web Services EMEA SARL.
  location: Dublin, Ireland
  email: yuta_kawada@outlook.jp
  phone:
  website: https://kawadayuta.jp
  social_networks:
    - network: LinkedIn
      username: yuta-kawada
    - network: GitHub
      username: tskawada
  sections:
    experience:
      - company: Amazon Web Services EMEA SARL.
        position: Cloud Support Engineer I (Deployment)
        start_date: 2025-04
        end_date: present
        location: Dublin, Ireland
        highlights:
          - Delivering professional technical support to enterprise-level
            customers on container services (ECS, EKS, ECR), CI/CD (CodeCommit,
            CodeBuild, CodeDeploy, CodePipeline, CodeConnection), and IaC
            (CloudFormation, CDK)
          - Resolved 200+ technical support cases with a focus on
            troubleshooting, root cause analysis, and best practice guidance
      - company: TechSword Co., Ltd.
        position: AI Engineer Intern
        start_date: 2021-11
        end_date: 2025-03
        location: Okayama, Japan
        highlights:
          - Built inference servers for image recognition AI on IoT devices
            including NVIDIA Jetson, optimizing models with TensorRT and
            Deepstream SDK to improve product performance
          - Managed client onboarding process and provided technical support for
            service introduction
          - Coordinated tie-up projects with partner companies, ensuring smooth
            communication between organizations
      - company: Sony Semiconductor Solutions Corporation
        position: Security Engineer Intern
        start_date: 2023-08
        end_date: 2023-09
        location: Tokyo, Japan
        highlights:
          - Developed ultra-lightweight image recognition AI using MobileNet for
            the AITRIOS edge AI camera platform
          - Prototyped application security evaluation criteria for the AITRIOS
            application marketplace
    education:
      - institution: Okayama University
        area: Environmental, Life, Natural Science and Technology
        degree: Master
        start_date: 2023-04
        end_date: 2025-03
        location: Okayama, Japan
        highlights:
          - 'Research focus: Pairing-based Cryptography, Zero-Knowledge Proofs,
            and Information Security'
          - 'Published 3 journal papers and 3 international conference papers
           on pairing-based cryptography and attribute-based encryption'
      - institution: Okayama University
        area: Electrical and Communication Engineering
        degree: Bachelor
        start_date: 2019-04
        end_date: 2023-03
        location: Okayama, Japan
        highlights:
          - 'Research focus: Cryptography and Information Security,
            Pairing-based Cryptography'
          - 1 domestic conference presentation on pairing-based cryptography
    awards:
      - bullet: "Rising Star Award, Amazon Web Services (2026)"
      - bullet: "Best Paper Award, ITC-CSCC 2023 -- *An Improvement of Algorithm for
          Computing Final Exponentiation for Pairing on KSS36 Curve and its
          Implementation* (2024)"
      - bullet: "GOLD Award (Grand Prize), Yahoo! Japan Digital Hack Day 2022
          -- Developed *Kiyaku no Iyaku*, a software for analyzing terms of
          service and evaluating risks (2022)"
    certifications:
      - bullet: AWS Certified DevOps Engineer -- Professional (2025)
      - bullet: AWS Certified Solutions Architect -- Associate (2025)
    skills:
      - label: Cloud
        details: AWS (ECS, EKS, ECR, CodeBuild, CodeDeploy, CodePipeline,
          CloudFormation, CDK, EC2, VPC)
      - label: Languages
        details: Python, C, C++, Java, TypeScript, Shell Script
      - label: Technologies
        details: NVIDIA TensorRT, Deepstream SDK, GPU Programming, Docker, Kubernetes
      - label: Networking
        details: TCP/IP, DNS, HTTP/HTTPS, VPN
      - label: Languages (Human)
        details: Japanese (Native), English (Business)
design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: New Computer Modern
      name: New Computer Modern
      headline: New Computer Modern
      connections: New Computer Modern
      section_titles: New Computer Modern
    font_size:
      body: 10pt
      name: 30pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.7cm
    space_below_headline: 0.7cm
    space_below_connections: 0.7cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: •
      space_between_connections: 0.5cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: ◦
      nested_bullet: ◦
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**
        *DEGREE* *in* *AREA*
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    experience_entry:
      main_column: |-
        **POSITION**
        *COMPANY*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
